name: Chyba
description: Něco nefunguje, jak má
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Nástroj
      placeholder: např. /faktura
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Co se stalo
      description: Popište chybu a co jste očekávali.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kroky k reprodukci
      placeholder: |
        1. Otevřít …
        2. Kliknout na …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Prohlížeč a zařízení
      placeholder: např. Safari 19, iPhone 16
